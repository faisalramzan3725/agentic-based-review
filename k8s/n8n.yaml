apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: journal-ai
spec:
  replicas: 1
  selector:
    matchLabels: {app: n8n}
  template:
    metadata:
      labels: {app: n8n}
    spec:
      containers:
        - name: n8n
          image: n8nio/n8n:latest
          ports: [{containerPort: 5678}]
          env:
            - {name: JOURNAL_API_URL, value: "http://journal-api.journal-ai.svc.cluster.local"}
            - {name: N8N_BLOCK_ENV_ACCESS_IN_NODE, value: "false"}
            - name: JOURNAL_API_KEY
              valueFrom: {secretKeyRef: {name: journal-secrets, key: JOURNAL_API_KEY}}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: journal-ai
spec:
  selector: {app: n8n}
  ports: [{port: 5678, targetPort: 5678}]
