# PostgreSQL holds the LangGraph checkpoints (workflow state across interrupts,
# i.e. while a manuscript waits for authors or the editor).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: journal-ai
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - {name: POSTGRES_USER, value: journal}
            - {name: POSTGRES_DB, value: journal}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: journal-secrets, key: POSTGRES_PASSWORD}}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "journal"]}
            periodSeconds: 5
          volumeMounts: [{name: pg-data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: pg-data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: 10Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: journal-ai
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
